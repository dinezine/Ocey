<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rahasia 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Love Animation Background -->
  <div class="love-bg" id="loveContainer"></div>

  <!-- Halaman Passcode -->
  <div class="container" id="passcodePage">
    <h2>Panggilan dari aku buat kamu</h2>
    <input type="password" id="passInput" placeholder="kalo gatau buang aja hp nya">
    <br>
    <button class="submit-btn" onclick="checkPass()">Verifikasi</button>
    <p id="errorMsg" style="color:red; display:none;">SALAHHH! Ocel palsu ya?</p>
  </div>

  <!-- Halaman Cinta -->
  <div class="container hidden" id="mainPage">
    <div class="card">
      <div class="emoji">Hi, pretty! 💘 </div>
      <h2>Ocey mau gak jadi pacarnya Axelio?</h2>
      <div class="image-box">
        <img src="ocey.jpg" alt="">
      </div>
      <div class="btn-group">
        <button class="yes" onclick="showPopup()">Mau 💗</button>
        <button class="no" id="noButton">Gak Mau 💔</button>
      </div>
    </div>
  </div>

  <!-- Pop-up -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <h3>Hi Mrs. Zinedine! 😍</h3>
      <p>Aku sayang kamu banget. Makasih udah tetap di sini buat aku sampai sekarang. Makasih juga udah sabar nungguin aku. Kita bangun hubungan ini sama sama ya sayangku.</p>
      <div class="popup-image">
        <img src="couple.jpg" alt="yay" />
      </div>
      <button onclick="closePopup()">Tutup</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
